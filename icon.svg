<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="canGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="40%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with safe padding -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.8"/>
  <circle cx="256" cy="256" r="200" fill="#1e40af" opacity="0.4"/>

  <!-- Milk Can Graphic in Center -->
  <g filter="url(#shadow)" transform="translate(0, 10)">
    <!-- Can Lid Handle -->
    <path d="M 210 130 C 210 105, 302 105, 302 130" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round"/>
    <!-- Can Lid -->
    <rect x="200" y="130" width="112" height="22" rx="6" fill="url(#goldGrad)"/>
    <!-- Can Neck -->
    <path d="M 215 152 L 297 152 L 315 200 L 197 200 Z" fill="url(#canGrad)"/>
    <!-- Can Main Body -->
    <rect x="175" y="200" width="162" height="150" rx="16" fill="url(#canGrad)"/>
    <!-- Can Base -->
    <path d="M 175 340 L 337 340 L 325 365 L 187 365 Z" fill="#94a3b8"/>
    
    <!-- Milk Splashes / Wave on Can -->
    <path d="M 175 270 Q 215 285, 256 270 T 337 270 L 337 350 L 175 350 Z" fill="#3b82f6" opacity="0.15"/>
    
    <!-- Cow Emblem / Milk Drop in Gold on Can -->
    <circle cx="256" cy="255" r="32" fill="#1e3a8a"/>
    <path d="M 256 232 C 256 232 240 252 240 262 C 240 271 247 278 256 278 C 265 278 272 271 272 262 C 272 252 256 232 256 232 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Side Milk Splash Drops -->
  <circle cx="140" cy="220" r="14" fill="#ffffff" opacity="0.9"/>
  <circle cx="120" cy="260" r="9" fill="#ffffff" opacity="0.75"/>
  <circle cx="372" cy="220" r="14" fill="#ffffff" opacity="0.9"/>
  <circle cx="392" cy="260" r="9" fill="#ffffff" opacity="0.75"/>

  <!-- Text: दिलीप यादव -->
  <text x="256" y="420" text-anchor="middle" font-family="'Mukta', 'Poppins', sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="1">
    दिलीप यादव
  </text>
  <!-- Text: DILIP YADAV -->
  <text x="256" y="455" text-anchor="middle" font-family="'Poppins', sans-serif" font-size="20" font-weight="700" fill="#facc15" letter-spacing="4">
    DILIP YADAV
  </text>
</svg>
